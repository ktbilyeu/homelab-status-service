services:
  status-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: homelab-status-service:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "local"
      options:
        max-size: "20m"
        max-file: "5"
    env_file:
      - path: ${STATUS_PRIVATE_ENV_FILE:-./.env}
        required: false
    environment:
      - TZ=America/Denver
      - DATABASE_URL=sqlite+aiosqlite:////app/data/status.db
      - CHECK_INTERVAL=60
      - TIMEOUT=10
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend:ro
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.status-service.rule=${STATUS_ROUTER_RULE:-Host(`status.kadenbilyeu.com`) || Host(`status.kakusui.org`) || Host(`status.easytl.org`) || Host(`status.tetragroup.io`)}
      - traefik.http.routers.status-service.entrypoints=web
      - traefik.http.services.status-service.loadbalancer.server.port=8000
      - traefik.http.middlewares.status-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS
      - traefik.http.middlewares.status-cors.headers.accesscontrolallowheaders=Authorization,Content-Type,X-Requested-With
      - traefik.http.middlewares.status-cors.headers.accesscontrolalloworiginlist=${STATUS_CORS_ALLOW_ORIGINS:-https://kadenbilyeu.com,https://status.kadenbilyeu.com,https://kakusui.org,https://status.kakusui.org,https://easytl.org,https://status.easytl.org,https://tetragroup.io,https://status.tetragroup.io}
      - traefik.http.middlewares.status-cors.headers.accesscontrolallowcredentials=true
      - traefik.http.routers.status-service.middlewares=status-cors@docker

networks:
  proxy:
    external: true
